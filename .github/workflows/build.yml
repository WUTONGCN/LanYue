name: Build portable apps

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-release
  cancel-in-progress: false

jobs:
  version:
    name: Select release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Select version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-version.cjs --resolve

  build:
    name: Build ${{ matrix.target }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: mac-arm64
            command: npm run release:mac
          - runner: windows-2022
            target: win-x64
            command: npm run pack:win
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      LANYUE_TARGET: ${{ matrix.target }}
      LANYUE_BUILD_VERSION: ${{ needs.version.outputs.version }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Check release version
        id: version
        run: node scripts/ci-version.cjs
      - name: Install npm dependencies
        run: npm ci
      - name: Fetch pinned preview engine
        run: |
          git config --global core.longpaths true
          node scripts/bootstrap.cjs
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: vendor/kkFileView/**/pom.xml
      - name: Install Windows C++ compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & C:\msys64\usr\bin\bash.exe -lc 'pacman -Sy --noconfirm --needed mingw-w64-x86_64-gcc'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'LANYUE_MINGW_CXX=C:\msys64\mingw64\bin\g++.exe' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'C:\msys64\mingw64\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build preview engine
        run: npm run engine:build
      - name: Download and prepare portable runtime
        run: node scripts/prepare-ci-runtime.cjs
      - name: Package application
        run: ${{ matrix.command }}
      - name: Generate SHA256 checksum
        run: node scripts/checksums.cjs
      - name: Upload portable package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: LanYue-${{ steps.version.outputs.version }}-${{ matrix.target }}-${{ github.run_number }}
          path: |
            dist/LanYue-*-${{ matrix.target }}.zip
            dist/LanYue-*-${{ matrix.target }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v${{ needs.version.outputs.version }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: LanYue-*
          merge-multiple: true
          path: release-assets
      - name: Publish complete portable packages
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          test -s "LanYue-${RELEASE_VERSION}-mac-arm64.zip"
          test -s "LanYue-${RELEASE_VERSION}-win-x64.zip"
          cat ./*.zip.sha256 > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          if gh release view "$RELEASE_TAG" --json isDraft,targetCommitish > release.json 2>/dev/null; then
            jq -e --arg commit "$RELEASE_COMMIT" '.targetCommitish == $commit' release.json >/dev/null
            if jq -e '.isDraft == false' release.json >/dev/null; then
              echo "Release $RELEASE_TAG is already published."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --target "$RELEASE_COMMIT" --draft --title "LanYue $RELEASE_TAG" --notes '下载对应系统的 ZIP，完整解压后打开 LanYue。mac-arm64 适用于 Apple 芯片 Mac，win-x64 适用于 Windows x64。'
          fi
          gh release upload "$RELEASE_TAG" ./*.zip SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
